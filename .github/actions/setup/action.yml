name: Set up
description: pnpm, Node from .nvmrc, dependencies, and cached Playwright browsers.
inputs:
  browsers:
    # The Vitest browser projects need Chromium only; each e2e job installs
    # its own project's engine. Empty: none.
    description: Playwright browsers to install, space-separated.
    default: chromium
runs:
  using: composite
  steps:
    # Pinned by commit (Dependabot keeps them current): the deploy jobs run
    # this with AWS credentials. pnpm's version comes from package.json
    # "packageManager".
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
    # pnpm's store, under a key only full installs write. setup-node's
    # `cache: pnpm` keys by the lockfile alone, so partial installs (ci.yml's
    # proof job installs only turbo) would save it first and most packages be
    # downloaded again.
    - id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: playwright
      if: inputs.browsers != ''
      run: echo "version=$(pnpm --filter @acme/frontend exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: playwright-cache
      if: inputs.browsers != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}
    - if: inputs.browsers != '' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm --filter @acme/frontend exec playwright install --with-deps ${{ inputs.browsers }}
      shell: bash
    - if: inputs.browsers != '' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm --filter @acme/frontend exec playwright install-deps ${{ inputs.browsers }}
      shell: bash
